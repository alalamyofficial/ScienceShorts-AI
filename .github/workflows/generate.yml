
name: Generate ScienceShorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Generate videos
        run: |
          python -u main.py
          echo "=== Generated files ==="
          find output -maxdepth 1 -type f -printf '%f %s bytes\n'
          test "$(find output -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 3

      - name: Save videos for download
        uses: actions/upload-artifact@v4
        with:
          name: science-shorts-videos
          path: |
            output/*.mp4
            output/*.srt
            output/*.json
          if-no-files-found: error
          retention-days: 7

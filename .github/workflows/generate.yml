name: Generate ScienceShorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "=== FFmpeg version ==="
          ffmpeg -version | head -n 2
          echo "=== FFprobe version ==="
          ffprobe -version | head -n 1

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check project
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== PROJECT FILES ==="
          ls -lah
          echo "=== CHECK PYTHON SYNTAX ==="
          python -m py_compile main.py
          echo "Python syntax is valid."

      - name: Generate videos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== START VIDEO GENERATION ==="
          python -u main.py

          echo "=== CHECK OUTPUT DIRECTORY ==="
          if [ ! -d output ]; then
            echo "ERROR: output directory does not exist."
            exit 1
          fi

          echo "=== ALL OUTPUT FILES ==="
          find output -maxdepth 1 -type f -printf '%f (%s bytes)\n'

          echo "=== VERIFY MP4 VIDEOS ==="
          count=0

          for file in output/*.mp4; do
            [ -f "$file" ] || continue

            echo "Checking: $file"
            ffprobe -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$file"

            count=$((count + 1))
          done

          echo "Valid MP4 files: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No MP4 videos were generated."
            exit 1
          fi

      - name: Save videos for download
        uses: actions/upload-artifact@v4
        with:
          name: science-shorts-videos
          path: |
            output/*.mp4
            output/*.srt
            output/*.json
          if-no-files-found: error
          retention-days: 7

name: Generate ScienceShorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check project files
        run: |
          echo "=== REPOSITORY ==="
          pwd
          ls -lah
          echo "=== CHECK REQUIRED FILES ==="
          test -f main.py
          test -f requirements.txt
          echo "=== PYTHON SYNTAX ==="
          python -m py_compile main.py

      - name: Generate videos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== START GENERATION ==="
          python -u main.py

          echo "=== CHECK OUTPUT DIRECTORY ==="
          if [ ! -d output ]; then
            echo "ERROR: output directory does not exist."
            exit 1
          fi

          echo "=== LIST GENERATED FILES ==="
          find output -maxdepth 1 -type f -printf '%f (%s bytes)\n'

          echo "=== VALIDATE MP4 VIDEOS ==="
          count=0

          for file in output/*.mp4; do
            [ -f "$file" ] || continue

            echo "Checking $file"
            ffprobe -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$file"

            count=$((count + 1))
          done

          echo "MP4 count: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No MP4 videos were generated."
            exit 1
          fi

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: science-shorts-videos
          path: |
            output/*.mp4
            output/*.srt
            output/*.json
          if-no-files-found: error
          retention-days: 7

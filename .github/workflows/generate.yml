name: Generate ScienceShorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check project files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== PROJECT FILES ==="
          ls -lah
          echo "=== MAIN.PY ==="
          test -f main.py
          echo "main.py exists"
          echo "=== REQUIREMENTS ==="
          test -f requirements.txt
          echo "requirements.txt exists"

      - name: Generate videos
        run: |
          set -e
          echo "=== STARTING VIDEO GENERATION ==="
          python -u main.py
          echo "=== OUTPUT DIRECTORY ==="
          if [ -d output ]; then
            ls -lah output
          else
            echo "ERROR: output directory was not created"
            exit 1
          fi
          echo "=== GENERATED FILES ==="
          find output -maxdepth 1 -type f -print
          echo "=== CHECK MP4 FILES ==="
          find output -maxdepth 1 -type f -name '*.mp4' -print
          MP4_COUNT=$(find output -maxdepth 1 -type f -name '*.mp4' | wc -l)
          echo "MP4 count: $MP4_COUNT"
          if [ "$MP4_COUNT" -eq 0 ]; then
            echo "ERROR: No MP4 videos were generated"
            exit 1
          fi

      - name: Save videos for download
        uses: actions/upload-artifact@v4
        with:
          name: science-shorts-videos
          path: |
            output/*.mp4
            output/*.srt
            output/*.json
          if-no-files-found: error
          retention-days: 7
